[package]
name = "peakmark"
version = "0.1.1"
edition = "2024"
description = "Gate WebAssembly modules on size and memory against a baseline kept in the repository"
license = "MIT"
repository = "https://github.com/casoon/peakmark"
readme = "README.md"
keywords = ["wasm", "webassembly", "memory", "size", "budget"]
categories = ["command-line-utilities", "wasm", "development-tools"]
exclude = ["plan/**", "site/**", "docs/**", "examples/**", ".github/**"]

# brotli at quality 11 takes minutes per megabyte when it is not optimised,
# so the dependencies are optimised in debug builds too.
[profile.dev.package."*"]
opt-level = 3

[dependencies]
brotli = "9.1.1"
flate2 = "1.1.11"
runemark = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
wasmparser = "0.263.0"

[dev-dependencies]
serde_json = "1.0.154"
wat = "1.263.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
# Byte counts are far below 2^52 and the rounding is the point of the
# conversion, so the casts between u64 and f64 lose nothing that matters.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# The only `expect`s serialise plain data or write to a `Vec`; they state an
# invariant and cannot fire, so they get no `# Panics` section.
missing_panics_doc = "allow"
